name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    name: Build & Verify Backend (mn-api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: mn-api
        run: npm install

      - name: Build Backend
        working-directory: mn-api
        run: npm run build

  build-frontend:
    name: Build & Verify Frontend (mn-client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: mn-client
        run: npm install

      - name: Build Frontend
        working-directory: mn-client
        env:
          NEXT_PUBLIC_API_URL: https://malappuramnikah.onrender.com
        run: npm run build
